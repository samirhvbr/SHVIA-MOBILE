<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" />
    <!-- Mesma marca do splash: o ícone da aba/janela é PRÉ-LOGIN, então segue a
         regra de marca da migração (a Blue3 só depois do login). O favicon.png antigo
         era a seta da Blue3; SVG porque o WebView renderiza vetor. -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>ShvIA</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Splash de lançamento (mobile): marca "respirando" + ondas de sonar
         enquanto conecta; estado offline com retry (src/main.ts troca o
         data-state). Paleta = tokens do ShvIA web, pra transição casca→app
         ser invisível. -->
    <main id="bootstrap" class="bootstrap" role="status" aria-live="polite" data-state="connecting">
      <div class="mark-wrap">
        <span class="ripple" aria-hidden="true"></span>
        <span class="ripple ripple--late" aria-hidden="true"></span>
        <img class="brand-mark" src="/brand-mark.svg" alt="" width="176" height="176" />
      </div>
      <h1>ShvIA</h1>
      <p id="status">Conectando ao ShvIA…</p>
      <div class="actions only-offline">
        <button id="retry" type="button">Tentar agora</button>
        <button id="force-open" type="button" class="ghost">Abrir mesmo assim</button>
      </div>
      <span class="foot" id="foot" aria-hidden="true"></span>
      <noscript>Este aplicativo precisa de JavaScript para carregar o ShvIA.</noscript>
    </main>

    <!-- Trava biométrica (M3/ADR-002): overlay LOCAL que gateia o acesso antes
         de navegar pro ShvIA remoto. Dois modos (data-mode "optin" | "lock"),
         controlados por src/main.ts: opt-in de 1ª execução e desbloqueio no
         cold-start. Escondido por padrão — só a casca local o usa. -->
    <section id="lock" class="lock" hidden data-mode="lock" role="dialog" aria-modal="true" aria-live="polite">
      <div class="lock-card">
        <img class="lock-mark" src="/brand-mark.svg" alt="" width="96" height="96" />
        <h2 id="lock-title">ShvIA bloqueado</h2>
        <p id="lock-msg">Use o Face ID para desbloquear.</p>
        <div class="lock-actions">
          <button id="lock-primary" type="button">Desbloquear</button>
          <button id="lock-secondary" type="button" class="ghost" hidden>Agora não</button>
        </div>
      </div>
    </section>
  </body>
</html>
