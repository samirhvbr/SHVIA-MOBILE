[package]
name = "tauri-plugin-shvia-push"
version = "0.1.0"
edition = "2021"
description = "Push remoto (APNs) do ShvIA Mobile — plugin interno, iOS-only por ora"
links = "tauri-plugin-shvia-push"
publish = false

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
